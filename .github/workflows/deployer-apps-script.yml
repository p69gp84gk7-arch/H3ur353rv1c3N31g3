# Envoie automatiquement le code vers Google Apps Script
# quand une pull request est acceptée (fusionnée) dans la branche main,
# puis met à jour la page web du planning (son adresse ne change pas).
name: Déployer vers Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.github/workflows/deployer-apps-script.yml'
  workflow_dispatch:

concurrency:
  group: deployer-apps-script
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer clasp (outil Google)
        run: npm install -g @google/clasp@2.4.2

      - name: Vérifier la configuration
        run: |
          if grep -q "A_REMPLACER" apps-script/.clasp.json; then
            echo "::error::L'ID du script n'est pas encore renseigné dans apps-script/.clasp.json (voir docs/MISE-EN-PLACE.md, étape 1)."
            exit 1
          fi

      - name: Installer la clé d'accès Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Le secret CLASPRC_JSON est manquant (voir docs/MISE-EN-PLACE.md, étape 4)."
            exit 1
          fi
          # Répare un copier-coller abîmé : retours à la ligne ajoutés par le terminal, texte avant { ou après }
          printf '%s' "$CLASPRC_JSON" | tr -d '\r\n' | sed -e 's/^[^{]*//' -e 's/[^}]*$//' > "$HOME/.clasprc.json"
          node -e '
            const fs = require("fs");
            let j;
            try { j = JSON.parse(fs.readFileSync(process.env.HOME + "/.clasprc.json", "utf8")); }
            catch (e) {
              console.log("::error::Le secret CLASPRC_JSON est abîmé (copie incomplète ?). Refaites « cat ~/.clasprc.json » dans Cloud Shell et recopiez TOUT, de la première { à la dernière }.");
              process.exit(1);
            }
            const tok = j.token || (j.tokens && j.tokens.default);
            if (!tok || !tok.refresh_token) {
              console.log("::error::Le secret CLASPRC_JSON ne contient pas la clé attendue (refresh_token). Éléments trouvés : " + Object.keys(j).join(", "));
              process.exit(1);
            }
            console.log("Clé d’accès lue correctement.");
          '

      - name: Envoyer le code vers Apps Script
        working-directory: apps-script
        run: clasp push --force

      - name: Mettre à jour la page web (même adresse)
        working-directory: apps-script
        env:
          DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          trouver() { clasp deployments | grep -v '@HEAD' | grep -oE 'AKfy[A-Za-z0-9_-]+' | head -1 || true; }
          [ -z "$DEPLOYMENT_ID" ] && DEPLOYMENT_ID=$(trouver)
          if [ -n "$DEPLOYMENT_ID" ]; then
            clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "Version ${GITHUB_SHA::7}"
          else
            echo "Première mise en ligne : création de la page web."
            clasp deploy --description "Version ${GITHUB_SHA::7}"
            DEPLOYMENT_ID=$(trouver)
          fi
          URL="https://script.google.com/macros/s/$DEPLOYMENT_ID/exec"
          echo "Adresse du planning : $URL"
          {
            echo "### ❄ Planning mis à jour"
            echo ""
            echo "Adresse du planning (à mettre en favori, sur ordinateur et smartphone) :"
            echo ""
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"
